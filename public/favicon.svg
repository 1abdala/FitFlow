<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#111A33" />
    </linearGradient>
    
    <!-- Path Gradient -->
    <linearGradient id="path-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#863BFF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg-grad)" />
  <rect width="30" height="30" x="1" y="1" rx="7" stroke="#863BFF" stroke-opacity="0.15" stroke-width="1" />

  <!-- Logo Path -->
  <g transform="translate(4, 4)">
    <!-- Path: M3 17l4-4 3 3 5-6 6 6 -->
    <path d="M3 17l4-4 3 3 5-6 6 6" stroke="url(#path-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Circle: cx="20" cy="16" r="1.5" -->
    <circle cx="20" cy="16" r="2" fill="#06B6D4" filter="url(#glow)" />
  </g>
</svg>