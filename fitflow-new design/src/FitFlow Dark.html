<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FitFlow — Dark</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="src/styles.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/landing.jsx"></script>
<script type="text/babel" src="src/dashboard.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "midnight",
  "startScreen": "landing",
  "accentBoost": false
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState(TWEAK_DEFAULTS.startScreen || "landing");

  // apply theme to <html>
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", t.theme);
  }, [t.theme]);

  // Optional: a vivid "boost" — turns up accent saturation via a CSS class
  useEffect(() => {
    document.documentElement.classList.toggle("accent-boost", !!t.accentBoost);
  }, [t.accentBoost]);

  return (
    <>
      {screen === "landing"
        ? <window.Landing onEnterDashboard={() => setScreen("dashboard")} />
        : <window.Dashboard onBackToLanding={() => setScreen("landing")} />
      }

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection label="Theme">
          <window.TweakRadio
            label="Palette"
            value={t.theme}
            onChange={(v) => setTweak("theme", v)}
            options={[
              { value: "midnight", label: "Midnight" },
              { value: "oled", label: "OLED" },
              { value: "indigo", label: "Indigo" },
            ]}
          />
          <window.TweakToggle
            label="Saturation boost"
            value={t.accentBoost}
            onChange={(v) => setTweak("accentBoost", v)}
          />
        </window.TweakSection>

        <window.TweakSection label="View">
          <window.TweakRadio
            label="Screen"
            value={screen}
            onChange={(v) => setScreen(v)}
            options={[
              { value: "landing", label: "Landing" },
              { value: "dashboard", label: "Dashboard" },
            ]}
          />
        </window.TweakSection>
      </window.TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<style>
.accent-boost { filter: saturate(1.25); }
[data-screen-label]{}
</style>

</body>
</html>
