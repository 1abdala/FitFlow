name: FitFlow Weekly Resend Digest & Skills Recommendation

on:
  schedule:
    # Trigger weekly on Monday at 00:00 UTC (8:00 AM Malaysia Time MYT, UTC+8)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  weekly-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scraper/requirements.txt ]; then
            pip install -r scraper/requirements.txt
          else
            pip install requests beautifulsoup4 supabase python-dotenv resend
          fi

      - name: Run Weekly Digest Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          HIGH_MATCH_THRESHOLD: "70"
          ENVIRONMENT: "GitHub Actions Production"
        run: |
          python scraper/send_weekly_digest.py
