name: FitFlow Daily Internship Scraper

on:
  schedule:
    # Trigger daily at 12:00 AM Malaysia Time (UTC+8) -> 4:00 PM UTC (16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scraper/requirements.txt ]; then
            pip install -r scraper/requirements.txt
          else
            pip install requests beautifulsoup4 supabase python-dotenv selenium webdriver-manager
          fi

      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          HIGH_MATCH_THRESHOLD: "70"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIRONMENT: "GitHub Actions Production"
        run: |
          python scraper/main.py

      - name: Send Telegram Failure Notification (Workflow Failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE=$'🚨 <b>FITFLOW WORKFLOW RUNTIME FAILURE</b>\n\nThe GitHub Actions scheduled scraper job failed during preparation or execution.\n\n<b>Workflow:</b> FitFlow Daily Internship Scraper\n<b>Run URL:</b> https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n<b>Trigger:</b> Scheduled Daily Scrape\n\nPlease check the GitHub Actions logs immediately.'
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "[WARNING] Telegram variables not configured. Cannot send workflow failure notification."
          fi
